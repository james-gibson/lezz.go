version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: lezz
    main: ./cmd/lezz
    binary: lezz
    ldflags:
      - -s -w -X main.buildVersion={{.Version}}
      - -X main.buildGitHubClientID={{ .Env.LEZZ_GITHUB_CLIENT_ID }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: lezz
    ids: [lezz]
    # go-selfupdate matches assets by suffix: {os}_{arch}.tar.gz / .zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

# macOS code signing and notarization via quill. GoReleaser vendors quill and
# filters this pipe to darwin binaries, so the linux and windows targets are
# untouched, and the signature is applied to the build artifact before it is
# archived — the copies inside the .tar.gz carry it too.
#
# `enabled` is gated on the signing secret so snapshot builds and forks without
# credentials still produce (unsigned) binaries instead of failing. The release
# workflow asserts MACOS_SIGN_P12 is set before a tag release for the same
# reason in reverse: without that check a missing secret would silently publish
# unsigned binaries with a green check.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [lezz]
      sign:
        # base64 of a Developer ID Application .p12 with the full Apple
        # certificate chain attached (`quill p12 attach-chain`).
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        # Signing alone still leaves Gatekeeper warning on first run. These
        # three App Store Connect API key values add the notarization ticket.
        # envOrDefault, not .Env: .Env is rendered with missingkey=error, so an
        # unset secret would fail the release instead of skipping notarization.
        # Empty values make GoReleaser sign and log that it did not notarize.
        key: '{{ envOrDefault "MACOS_NOTARY_KEY" "" }}'
        key_id: '{{ envOrDefault "MACOS_NOTARY_KEY_ID" "" }}'
        issuer_id: '{{ envOrDefault "MACOS_NOTARY_ISSUER_ID" "" }}'
        wait: true

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
