# layer/lezz.yaml  (LAYER FILE - mmdebstrap block belongs here)
# METABEGIN
# X-Env-Layer-Name: lezz
# X-Env-Layer-Version: 1.1.0
# X-Env-Layer-Desc: Embed the Go app, label the deployment environment, and optionally
#  start a base cluster at boot
# X-Env-Layer-Category: device
# X-Env-VarPrefix: lezz
# X-Env-Var-ENV: staging
# X-Env-Var-ENV-Desc: Deployment environment label (dev, staging, production)
# X-Env-Var-BIN_PATH: /usr/local/bin/lezz
# X-Env-Var-BIN_PATH-Desc: Install path of the Go binary
# X-Env-Var-appfile: ${DIRECTORY}/files/lezz
# X-Env-Var-appfile-Desc: The statically built binary to install
# X-Env-Var-appfile-Required: n
# X-Env-Var-appfile-Valid: string
# X-Env-Var-appfile-Set: y
# X-Env-Var-auto: n
# X-Env-Var-auto-Desc: Start "lezz auto" (a base cluster, empty and awaiting) at boot
# X-Env-Var-auto-Required: n
# X-Env-Var-auto-Valid: keywords:y,n
# X-Env-Var-auto-Set: y
# METAEND
---

mmdebstrap:
  customize-hooks:
    - |
      set -eu
      # rpi-image-gen lowercases the variable name it exposes: an X-Env-Var-ENV
      # declared above becomes IGconf_lezz_env, not IGconf_lezz_ENV. Reading the
      # upper-case form silently yields an empty string — the env label fell back
      # to the layer default and BIN_PATH expanded to nothing, which installs the
      # binary at the filesystem root (james-gibson/lezz.go#7).
      bin_path="${IGconf_lezz_bin_path:-/usr/local/bin/lezz}"
      env_label="${IGconf_lezz_env:-staging}"
      # ${DIRECTORY} is only expanded in layer metadata, not in hook bodies, so
      # the binary's path arrives as the appfile variable (see METAEND above).
      src="${IGconf_lezz_appfile}"
      if [ ! -f "${src}" ]; then
        echo "lezz layer: ${src} is missing; the release workflow must build it before the image" >&2
        exit 1
      fi
      install -D -m 0755 "${src}" "${1}${bin_path}"
      printf 'APP_ENV=%s\n' "${env_label}" >> "${1}/etc/environment"

      # The "auto" variant boots into a base cluster rather than an idle box:
      # `lezz auto` installs the managed tools from their own releases and
      # starts an empty cluster that is awaiting peers. It is a layer variable
      # rather than a second layer so the two images differ only by config.
      if [ "${IGconf_lezz_auto:-n}" = "y" ]; then
        unit="${1}/etc/systemd/system/lezz-auto.service"
        mkdir -p "$(dirname "${unit}")"
        cat > "${unit}" <<UNIT
      [Unit]
      Description=lezz auto — lab base cluster (awaiting peers)
      Documentation=https://github.com/james-gibson/lezz.go
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      EnvironmentFile=-/etc/environment
      ExecStart=${bin_path} auto
      Restart=on-failure
      RestartSec=10s
      # The cluster is the service: no timeout on a long-running supervisor.
      TimeoutStopSec=30s

      [Install]
      WantedBy=multi-user.target
      UNIT
        mkdir -p "${1}/etc/systemd/system/multi-user.target.wants"
        ln -sf /etc/systemd/system/lezz-auto.service \
          "${1}/etc/systemd/system/multi-user.target.wants/lezz-auto.service"
        echo "lezz layer: enabled lezz auto at boot (env ${env_label})"
      fi
