name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build ./cmd/lezz

  # .goreleaser.yml advertises six targets. Before this job existed nothing built
  # anything except the host platform, so the Windows targets were broken for as
  # long as the release config had claimed them (james-gibson/lezz.go#16).
  # Keep the matrix in step with `builds[0].goos`/`goarch` in .goreleaser.yml.
  release-target-builds:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build ./cmd/lezz
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/lezz

  # `goreleaser check` is the cheap way to validate .goreleaser.yml, but it only
  # ran inside the release workflow, which triggers on a `v*` tag — so an
  # invalid or deprecated key could sit on main until somebody remembered to run
  # it by hand. That is exactly how #40's `archives.builds` survived a major
  # version: the config was valid when written and deprecated by v2.
  #
  # This job is a parse, not a build: seconds, no cross-compilation, and it
  # tracks the same `~> v2` range the release workflow resolves, so a new v2
  # deprecation fails here before it can reach a tag.
  release-config:
    name: Validate release config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  # The site only ever rendered at release time, so a broken template or a dead
  # docs link would not be discovered until a tag was already public — and a
  # release is immutable, so the fix costs another version. Same reasoning as
  # release-config above: run the expensive-once thing on every pull request.
  #
  # The site is a separate module, so this also runs its tests, which the
  # repository-wide `go test ./...` in build-lint-test does not reach.
  site:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: site/go.mod
          cache: true
          cache-dependency-path: site/go.sum

      - name: Verify formatting (gofmt)
        working-directory: site
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        working-directory: site
        run: go test ./...

      - name: Render the site
        working-directory: site
        run: go run . -docs ../docs -out ../dist/site -base /lezz.go/ -version ci
