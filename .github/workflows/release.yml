name: Release

# Two entry points, one pipeline:
#
#   * push a `v*` tag     — the tag already exists, `prepare` only resolves it.
#   * workflow_dispatch   — `prepare` validates the version, creates and pushes
#                           the tag, then the same jobs run against it.
#
# The manual path must stay in this workflow. A tag pushed by the dispatch
# would not re-trigger this file, because GitHub does not start a run for refs
# pushed with the repository's own GITHUB_TOKEN — so a separate "tagging"
# workflow would hand off to nothing and report success having released
# nothing. Threading the created tag through `prepare` keeps one publisher and
# one source of truth for what a release contains.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and release, e.g. v0.16.0. Must not exist yet.'
        required: true
        type: string

permissions:
  contents: write

# One release per version at a time: a dispatch and a tag push for the same
# version must not race to create two releases (releases here are immutable).
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 0. Resolve the version. On a tag push the tag is the input; on a manual
  #    dispatch it is created here, so every later job has a real tag to check
  #    out and attach the release to.
  # ---------------------------------------------------------------------------
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve or create the tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ -z "${REQUESTED_VERSION}" ]; then
            # Tag-push path: the ref is the version.
            echo "tag=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual path. Releases are cut from main only — dispatching a release
          # from a feature branch would publish code that never merged.
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::a manual release must be dispatched from main, got ${REF}"
            exit 1
          fi

          # Shape first, so a typo cannot create a tag that breaks the
          # goreleaser version template or the `v*` trigger.
          if ! [[ "${REQUESTED_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'${REQUESTED_VERSION}' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

          # Releases are immutable: never move or overwrite an existing tag.
          if git ls-remote --exit-code --tags origin "refs/tags/${REQUESTED_VERSION}" >/dev/null 2>&1; then
            echo "::error::tag ${REQUESTED_VERSION} already exists on origin"
            exit 1
          fi

          # Annotated, so the tag carries the release's message and author.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${REQUESTED_VERSION}" -m "Release ${REQUESTED_VERSION}"
          git push origin "refs/tags/${REQUESTED_VERSION}"

          echo "tag=${REQUESTED_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Created and pushed tag ${REQUESTED_VERSION} on $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 1. Binaries. Goreleaser builds and archives every advertised target but does
  #    not publish: releases here are immutable, so there must be exactly one
  #    job that creates a release, and it must have every asset in hand.
  # ---------------------------------------------------------------------------
  binaries:
    name: Binaries
    needs: prepare
    runs-on: ubuntu-latest
    env:
      LEZZ_GITHUB_CLIENT_ID: ${{ vars.LEZZ_GITHUB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

      - name: Run tests
        run: go test ./...

      # A tag must never publish unsigned darwin binaries. The notarize block in
      # .goreleaser.yml is gated on MACOS_SIGN_P12, so an unset secret turns
      # signing into a no-op instead of a failure — catch that here.
      # Secrets are pushed by ~/projects/kb/scripts/codesign/setup-macos-signing-secrets.sh
      - name: Require macOS signing material
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          missing=""
          for var in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD; do
            if [ -z "${!var}" ]; then missing="$missing $var"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::refusing to publish unsigned darwin binaries — missing:$missing"
            exit 1
          fi
          for var in MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [ -z "${!var}" ]; then
              echo "::warning::darwin binaries will be signed but NOT notarized — $var is unset"
            fi
          done

      - name: Build release archives
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      # Assert the darwin binaries really carry a signature. GoReleaser fails
      # loudly on a bad certificate, but this also catches a skipped signing
      # step. quill is pinned and checksum-verified rather than curl | sh.
      - name: Verify darwin code signatures
        run: |
          set -euo pipefail
          version=0.7.1
          name="quill_${version}_linux_amd64.tar.gz"
          base="https://github.com/anchore/quill/releases/download/v${version}"
          curl -fsSL -o "/tmp/${name}" "${base}/${name}"
          curl -fsSL -o /tmp/quill-checksums.txt "${base}/quill_${version}_checksums.txt"
          grep -F "  ${name}" /tmp/quill-checksums.txt > /tmp/quill-want.sum
          (cd /tmp && sha256sum --check --strict quill-want.sum)
          tar -xzf "/tmp/${name}" -C /tmp quill
          sudo install -m 0755 /tmp/quill /usr/local/bin/quill

          shopt -s nullglob
          bins=(dist/*_darwin_*/*)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "::error::no darwin binaries found under dist/"
            exit 1
          fi
          for bin in "${bins[@]}"; do
            [ -f "$bin" ] || continue
            json=$(quill describe --output json "$bin" 2>/dev/null) || {
              echo "::error::$bin could not be parsed by quill"
              exit 1
            }
            # Go's darwin linker already applies an ad-hoc signature, so the
            # presence of a superBlob proves nothing. A real Developer ID
            # signature carries a CMS blob; ad-hoc signing leaves it empty.
            if ! jq -e '.[0].superBlob.signatures[0].base64 | length > 0' <<<"$json" >/dev/null 2>&1; then
              echo "::error::$bin is ad-hoc signed or unsigned, not Developer ID signed"
              exit 1
            fi
            team=$(jq -r '.[0].superBlob.codeDirectories[0].teamID // ""' <<<"$json")
            echo "signed: $bin (team: ${team:-unknown})"
          done


      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Images and the OTA package, built by the reusable workflow. Dispatch that
  #    workflow on its own for a full dry run that publishes nothing.
  # ---------------------------------------------------------------------------
  images:
    name: Images and OTA
    needs: prepare
    uses: ./.github/workflows/release-ota.yml
    with:
      environment: ${{ needs.prepare.outputs.tag }}
      ref: ${{ needs.prepare.outputs.tag }}

  # ---------------------------------------------------------------------------
  # 3. One publisher. Downloads every artifact from this run and creates the
  #    release once, so no two jobs race to create it.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [prepare, binaries, images]
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: List artifacts
        run: ls -l dist

      - name: Describe the image assets
        env:
          APP_ENV: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          # The images are named by their configs, not by this workflow, and the
          # builder publishes whichever form it produced (.img.zst, or the raw
          # .img if compression was off). Derive the release body from the assets
          # that actually arrived so the instructions cannot go stale
          # (james-gibson/lezz.go#34).
          images=()
          for f in dist/*.img dist/*.img.*; do
            if [ -f "$f" ]; then
              images+=("$(basename "$f")")
            fi
          done
          if [ ${#images[@]} -eq 0 ]; then
            echo "No image assets in dist/; refusing to describe a release without them" >&2
            ls -l dist >&2 || true
            exit 1
          fi

          compressed=n
          case "${images[0]:-}" in
            *.zst) compressed=y ;;
          esac

          {
            echo '## Binaries, lab images, and an OTA package'
            echo
            echo "**Environment:** \`${APP_ENV}\`"
            echo
            echo "Two images come out of the same layer and differ only by config:"
            echo
            echo '| Asset | Boots into |'
            echo '| --- | --- |'
            for name in "${images[@]}"; do
              case "$name" in
                *-auto*) boots='`lezz auto` as a systemd service: a base cluster, empty and awaiting peers' ;;
                *)       boots='an idle base image — `lezz` is installed, nothing runs' ;;
              esac
              echo "| \`${name}\` | ${boots} |"
            done
            echo
            echo 'The alarms are not baked into either image: `lezz install <tool>` fetches'
            echo 'them from their own ARM64 releases.'
            echo
            echo '`aptupgrade.tar.zst` is the Raspberry Pi Connect OTA package.'
            echo
            echo '### Install on a Raspberry Pi'
            echo
            echo '1. Flash an image.'
            if [ "${compressed}" = y ]; then
              echo '   Raspberry Pi Imager accepts the `.img.zst` assets as they are —'
              echo '   select one and let it decompress on write, no manual step:'
            else
              echo '   Use Raspberry Pi Imager and select one of the `.img` assets:'
            fi
            for name in "${images[@]}"; do
              case "$name" in
                *-auto*) boots='boots into `lezz auto`' ;;
                *)       boots='idle base image' ;;
              esac
              echo "   - \`${name}\` — ${boots}"
            done
            echo '2. One-time setup on the target Pi:'
            echo '   ```bash'
            echo '   # Standard Raspberry Pi OS'
            echo '   sudo apt update'
            echo '   sudo apt install rpi-connect rpi-connect-ota'
            echo '   # Raspberry Pi OS Lite'
            echo '   sudo apt install rpi-connect-lite rpi-connect-ota'
            echo '   ```'
            echo '3. Enable the service:'
            echo '   ```bash'
            echo '   rpi-connect ota on'
            echo '   ```'
            echo '4. Deploy via Raspberry Pi Connect using the asset URL, and verify it'
            echo '   against the SHA256 in `aptupgrade.tar.zst.sha256sum`.'
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          body_path: release-body.md

      - name: Print install instructions
        run: cat release-body.md >> "$GITHUB_STEP_SUMMARY"

