# I have everything I need. Here's a complete GitHub Action workflow that builds OTA packages with `otamaker` on tagged releases, publishes the artifacts, prints Pi install instructions, and includes a scaffolded failure webhook.

# ## Workflow File

# Save this as `.github/workflows/release-ota.yml`:

# ```yaml
name: Build, Image & Publish OTA Release

# Publish release artifacts on tagged refs
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment label'
        default: 'production'

permissions:
  contents: write

env:
  # --- rpi-image-gen ---
  IMAGE_CONFIG: configs/my-image.yaml
  # --- otamaker ---
  OTA_CONTENTS_FILE: ota/_contents_.yaml
  # Environment label embedded into the image (tag name, manual input, or default)
  APP_ENV: ${{ github.event.inputs.environment || github.ref_name }}

jobs:
  build:
    # rpi-image-gen needs an ARM64 Debian/Raspberry Pi OS-like host.
    # Use a self-hosted ARM64 runner if you have one; otherwise the GitHub
    # ARM64 hosted runner label below works for public repos.
    runs-on: ubuntu-24.04-arm
    outputs:
      ota_artifact: ${{ steps.ota.outputs.artifact_name }}
      ota_sha256:   ${{ steps.ota.outputs.sha256 }}
      image_name:   ${{ steps.image.outputs.image_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. Build the Go application (static ARM64 binary)
      # ---------------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Go app (static, ARM64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p layer/files
          go build -trimpath -ldflags="-s -w" -o layer/files/lezz ./cmd/lezz
          file layer/files/lezz || true

      # ---------------------------------------------------------------
      # 2. Build the Pi image with rpi-image-gen (embeds binary + env)
      # ---------------------------------------------------------------
      - name: Install rpi-image-gen prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Fetch rpi-image-gen
        run: |
          git clone --depth 1 https://github.com/raspberrypi/rpi-image-gen.git
          # install its dependencies (provided by the repo's helper)
          cd rpi-image-gen
          sudo ./install_deps.sh || true

      - name: Build image
        id: image
        working-directory: rpi-image-gen
        env:
          # Drive the embedded env label from the pipeline
          IGconf_myapp_ENV: ${{ env.APP_ENV }}
        run: |
          set -euo pipefail
          ./rpi-image-gen build -c "../${IMAGE_CONFIG}"

          # Locate the produced image (.img / .img.xz). Adjust glob if needed.
          IMG="$(find . -maxdepth 4 -type f \( -name '*.img' -o -name '*.img.xz' \) \
                 | head -n1)"
          if [ -z "${IMG}" ]; then
            echo "No image artifact produced by rpi-image-gen" >&2
            find . -maxdepth 4 -type f -name '*.img*' || true
            exit 1
          fi
          cp "${IMG}" "../$(basename "${IMG}")"
          echo "image_name=$(basename "${IMG}")" >> "$GITHUB_OUTPUT"
          echo "Built image: $(basename "${IMG}")"

      # ---------------------------------------------------------------
      # 3. Package the image as an OTA artifact with otamaker
      # ---------------------------------------------------------------
      - name: Install otamaker prerequisites
        run: sudo apt-get install -y cmake python3 zstd

      - name: Build and install otamaker
        run: |
          git clone --depth 1 https://github.com/raspberrypi/utils.git rpi-utils
          cd rpi-utils/otamaker
          cmake .
          make
          sudo make install

      - name: Build OTA artifact
        id: ota
        run: |
          set -euo pipefail

          # Ensure the contents file points at the freshly built image.
          # (Your _contents_.yaml should reference the image via an
          #  image-sparse payload; adjust path if the build placed it elsewhere.)
          otamaker -w "${OTA_CONTENTS_FILE}"

          ARTIFACT="$(grep -E '^\s*name:' "${OTA_CONTENTS_FILE}" \
                      | head -n1 | sed -E 's/^\s*name:\s*//; s/["'"'"']//g' | xargs)"

          if [ ! -f "${ARTIFACT}" ]; then
            echo "Expected OTA artifact '${ARTIFACT}' not found." >&2
            ls -l
            exit 1
          fi

          SHA="$(cut -d' ' -f1 "${ARTIFACT}.sha256sum")"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # 4. Upload + publish
      # ---------------------------------------------------------------
      - name: Upload build artifacts (CI retention)
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            ${{ steps.ota.outputs.artifact_name }}
            ${{ steps.ota.outputs.artifact_name }}.sha256sum
            ${{ steps.image.outputs.image_name }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.ota.outputs.artifact_name }}
            ${{ steps.ota.outputs.artifact_name }}.sha256sum
            ${{ steps.image.outputs.image_name }}
          generate_release_notes: true
          body: |
            ## OTA Update Package

            **Environment:** `${{ env.APP_ENV }}`
            **OTA artifact:** `${{ steps.ota.outputs.artifact_name }}`
            **SHA256:** `${{ steps.ota.outputs.sha256 }}`
            **Image:** `${{ steps.image.outputs.image_name }}`

            ### Install on a Raspberry Pi

            1. One-time setup on the target Pi:
               ```bash
               # Standard Raspberry Pi OS
               sudo apt update
               sudo apt install rpi-connect rpi-connect-ota
               # Raspberry Pi OS Lite
               sudo apt install rpi-connect-lite rpi-connect-ota

# ```

# ## How the workflow maps to your requirements

# | Requirement | Implementation |
# |---|---|
# | Publish release artifacts on tagged refs | Triggered by `push` on tags matching `v*`; `softprops/action-gh-release` attaches assets to the tag's Release [^1] |
# | otamaker requirements | Installs `cmake`/`python3`, runs `cmake . && make && sudo make install`, then builds with `otamaker -w` producing a `.tar.zst` and `.sha256sum` [^1] |
# | Print Pi install instructions | Written to the release body and `$GITHUB_STEP_SUMMARY` with the `rpi-connect`/`rpi-connect-ota` setup and `rpi-connect ota on` steps [^1] |
# | Future failure webhook | Scaffolded `notify-on-failure` job, disabled via `if: false`, ready to enable with a `FAILURE_WEBHOOK_URL` secret |

# ## Notes from the otamaker docs you should verify against your repo

# - **Contents file:** otamaker takes a YAML contents file as input; the first archive element must be `_contents_.yaml` describing the payloads (e.g. `image-sparse`, `script`, `tmpfile`) [^1]. Adjust the `OTA_CONTENTS_FILE` env var to your actual path.
# - **Output naming:** the artifact defaults to the `name` specified in the YAML, which is why the workflow parses that field to locate the file [^1].
# - **Checksum:** the `-w`/`--writesum` flag emits `<outfile>.sha256sum`, which is uploaded alongside the package [^1].
# - **Script payload return codes** (if your update runs a script): `0` = success, `1` = failure, `2` = success + request reboot; scripts run as `root` in a temp dir [^1].
# - otamaker can also be **run directly as a Python3 script** without building, if you'd prefer to skip the `cmake`/`make` steps [^1].

# To activate the failure webhook later: add a `FAILURE_WEBHOOK_URL` repository secret and change the `notify-on-failure` job's `if: false` to `if: failure() && needs.build-ota.result == 'failure'`.

# [^1]: [raw.githubusercontent.com](https://raw.githubusercontent.com/raspberrypi/utils/refs/heads/master/otamaker/README.md) (100%)
