name: Build images & OTA package

# Reusable builder: invoked by the Release workflow on a tag, and dispatchable on
# its own as a full dry run. It publishes nothing — one job in the caller decides
# what a release contains, because releases in this repository are immutable and
# a second publisher can only fail.
on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment label embedded in the image'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment label'
        default: 'production'

permissions:
  contents: read

env:
  OTA_CONTENTS_FILE: ota/_contents_.yaml
  # Environment label embedded into the image (tag name, manual input, or default)
  APP_ENV: ${{ inputs.environment || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. One image per config variation. They differ only by config: the base
  #    image is idle at boot, the auto image runs `lezz auto`.
  # ---------------------------------------------------------------------------
  images:
    name: Image (${{ matrix.variant }})
    # rpi-image-gen needs an ARM64 Debian/Raspberry Pi OS-like host.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            config: configs/my-image.yaml
          - variant: auto
            config: configs/my-image-auto.yaml
    env:
      IMAGE_CONFIG: ${{ matrix.config }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Go app (static, ARM64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
          LEZZ_GITHUB_CLIENT_ID: ${{ vars.LEZZ_GITHUB_CLIENT_ID }}
        run: |
          mkdir -p layer/files
          go build -trimpath -ldflags="-s -w -X main.buildGitHubClientID=${LEZZ_GITHUB_CLIENT_ID:-}" -o layer/files/lezz ./cmd/lezz
          file layer/files/lezz || true

      - name: Install rpi-image-gen prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Fetch rpi-image-gen
        run: |
          # Pin the release rather than tracking master: the layer search rules
          # (-S) and the config schema are part of what this workflow depends on,
          # and an upstream refactor would otherwise break tagged releases
          # silently (james-gibson/lezz.go#7, #18).
          git clone --depth 1 --branch v2.8.0 \
            https://github.com/raspberrypi/rpi-image-gen.git
          # install its dependencies (provided by the repo's helper)
          cd rpi-image-gen
          sudo ./install_deps.sh

      - name: Build image (${{ matrix.variant }})
        id: image
        working-directory: rpi-image-gen
        env:
          # Drive the embedded env label from the pipeline. rpi-image-gen
          # lowercases the variable name it exposes, so an X-Env-Var-ENV in the
          # layer becomes IGconf_lezz_env — the upper-case form is not read
          # (james-gibson/lezz.go#7).
          IGconf_lezz_env: ${{ env.APP_ENV }}
        run: |
          set -euo pipefail
          # -S .. makes the repository root a layer source tree, so layer/lezz.yaml
          # is found without copying it into the rpi-image-gen checkout. Without
          # it the search path is only the tool's own device/image/layer dirs and
          # the build dies with "Layer 'lezz' not found" (james-gibson/lezz.go#7).
          ./rpi-image-gen build -S .. -c "../${IMAGE_CONFIG}" 2>&1 \
            | tee "../rpi-image-gen-${{ matrix.variant }}.log"

          # Locate the produced image (./work/image-<name>/<name>.img, optionally .xz).
          IMG="$(find work -maxdepth 3 -type f \( -name '*.img' -o -name '*.img.xz' \) \
                 | head -n1)"
          if [ -z "${IMG}" ]; then
            echo "No image artifact produced by rpi-image-gen" >&2
            find work -maxdepth 3 -type f | head -50 >&2 || true
            exit 1
          fi
          cp "${IMG}" "../$(basename "${IMG}")"
          echo "image_name=$(basename "${IMG}")" >> "$GITHUB_OUTPUT"
          echo "Built image: $(basename "${IMG}")"

      - name: Upload image (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.variant }}
          path: ${{ steps.image.outputs.image_name }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. OTA package. The payload is the apt-upgrade script, not the image: the
  #    image is flashed, the OTA updates a running device.
  # ---------------------------------------------------------------------------
  ota:
    name: OTA package
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install otamaker prerequisites
        run: sudo apt-get install -y cmake python3 zstd

      - name: Build and install otamaker
        run: |
          git clone --depth 1 https://github.com/raspberrypi/utils.git rpi-utils
          cd rpi-utils/otamaker
          cmake .
          make
          sudo make install

      - name: Build OTA artifact
        id: ota
        run: |
          set -euo pipefail

          # otamaker resolves every payload's name relative to the working
          # directory, so run from the contents file's own directory. Payload
          # names are the file names inside the artefact, not paths.
          cd "$(dirname "${OTA_CONTENTS_FILE}")"
          otamaker -w "$(basename "${OTA_CONTENTS_FILE}")"

          ARTIFACT="$(grep -E '^\s*name:' "$(basename "${OTA_CONTENTS_FILE}")" \
                      | head -n1 | sed -E 's/^\s*name:\s*//; s/["'"'"']//g' | xargs)"

          if [ ! -f "${ARTIFACT}" ]; then
            echo "Expected OTA artifact '${ARTIFACT}' not found." >&2
            ls -l
            exit 1
          fi

          SHA="$(cut -d' ' -f1 "${ARTIFACT}.sha256sum")"
          # Keep the published asset names flat.
          mv "${ARTIFACT}" "${ARTIFACT}.sha256sum" ..
          cd ..
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload OTA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ota
          path: |
            ${{ steps.ota.outputs.artifact_name }}
            ${{ steps.ota.outputs.artifact_name }}.sha256sum
          if-no-files-found: error
