# Config variation: the same minimal image, but it boots into `lezz auto`
# instead of sitting idle. `lezz auto` starts a base cluster that is empty and
# awaiting peers, and installs the managed tools from their own ARM64 releases —
# so the alarms still are not baked into the image.
layer:
  base: trixie-minbase
  device: rpi3
  app: lezz

image:
  layer: image-rpios
  name: lezz-rpi3-auto
  boot_part_size: 200%
  root_part_size: 300%

lezz:
  env: staging
  auto: y
